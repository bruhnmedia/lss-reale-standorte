name: BRUHN MEDIA | OSM Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/test-osm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Niedersachsen-Datenpipeline prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Repository abrufen
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python-Quelldateien prüfen
        run: python -m compileall -q tools tests
      - name: Standort- und Dublettenprüfungen ausführen
        run: python -m unittest discover -s tests -v
